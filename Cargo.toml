[package]
name = "qcbot"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serenity = "0.12.5"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
toml = "1.1.8"
serde = { version = "1.0.229", features = ["derive"] }
regex = "1.13.1"
rand = "0.10.3"
chrono = "0.4.45"
chrono-tz = "0.10.4"
